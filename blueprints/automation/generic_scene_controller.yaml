# MQTT discovery through the Hubitat Elevation hub exposes these event entities.
# Supported event types: pushed, held, doubleTapped, released.
# Each button has one event entity and four independent action slots.
---
blueprint:
  name: Generic Multi-Button Scene Controller
  description: Generic event-entity scene controllers with four per-button action slots.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"
  input:
    button_1:
      name: Button 1
      description: Generic event-entity inputs and actions for button 1.
      collapsed: true
      icon: mdi:numeric-1-box-outline
      input:
        button_1_entity:
          name: Button 1 event entity
          description: Event entity for button 1.
          default: ""
          selector:
            entity:
              domain: event
        button_1_pushed:
          name: Button 1 pushed action
          description: Action to run when button 1 is pushed.
          default: []
          selector:
            action: {}
        button_1_held:
          name: Button 1 held action
          description: Action to run when button 1 is held.
          default: []
          selector:
            action: {}
        button_1_doubleTapped:
          name: Button 1 doubleTapped action
          description: Action to run when button 1 is doubleTapped.
          default: []
          selector:
            action: {}
        button_1_released:
          name: Button 1 released action
          description: Action to run when button 1 is released.
          default: []
          selector:
            action: {}
    button_2:
      name: Button 2
      description: Generic event-entity inputs and actions for button 2.
      collapsed: true
      icon: mdi:numeric-2-box-outline
      input:
        button_2_entity:
          name: Button 2 event entity
          description: Event entity for button 2.
          default: ""
          selector:
            entity:
              domain: event
        button_2_pushed:
          name: Button 2 pushed action
          description: Action to run when button 2 is pushed.
          default: []
          selector:
            action: {}
        button_2_held:
          name: Button 2 held action
          description: Action to run when button 2 is held.
          default: []
          selector:
            action: {}
        button_2_doubleTapped:
          name: Button 2 doubleTapped action
          description: Action to run when button 2 is doubleTapped.
          default: []
          selector:
            action: {}
        button_2_released:
          name: Button 2 released action
          description: Action to run when button 2 is released.
          default: []
          selector:
            action: {}
    button_3:
      name: Button 3
      description: Generic event-entity inputs and actions for button 3.
      collapsed: true
      icon: mdi:numeric-3-box-outline
      input:
        button_3_entity:
          name: Button 3 event entity
          description: Event entity for button 3.
          default: ""
          selector:
            entity:
              domain: event
        button_3_pushed:
          name: Button 3 pushed action
          description: Action to run when button 3 is pushed.
          default: []
          selector:
            action: {}
        button_3_held:
          name: Button 3 held action
          description: Action to run when button 3 is held.
          default: []
          selector:
            action: {}
        button_3_doubleTapped:
          name: Button 3 doubleTapped action
          description: Action to run when button 3 is doubleTapped.
          default: []
          selector:
            action: {}
        button_3_released:
          name: Button 3 released action
          description: Action to run when button 3 is released.
          default: []
          selector:
            action: {}
    button_4:
      name: Button 4
      description: Generic event-entity inputs and actions for button 4.
      collapsed: true
      icon: mdi:numeric-4-box-outline
      input:
        button_4_entity:
          name: Button 4 event entity
          description: Event entity for button 4.
          default: ""
          selector:
            entity:
              domain: event
        button_4_pushed:
          name: Button 4 pushed action
          description: Action to run when button 4 is pushed.
          default: []
          selector:
            action: {}
        button_4_held:
          name: Button 4 held action
          description: Action to run when button 4 is held.
          default: []
          selector:
            action: {}
        button_4_doubleTapped:
          name: Button 4 doubleTapped action
          description: Action to run when button 4 is doubleTapped.
          default: []
          selector:
            action: {}
        button_4_released:
          name: Button 4 released action
          description: Action to run when button 4 is released.
          default: []
          selector:
            action: {}
    button_5:
      name: Button 5
      description: Generic event-entity inputs and actions for button 5.
      collapsed: true
      icon: mdi:numeric-5-box-outline
      input:
        button_5_entity:
          name: Button 5 event entity
          description: Event entity for button 5.
          default: ""
          selector:
            entity:
              domain: event
        button_5_pushed:
          name: Button 5 pushed action
          description: Action to run when button 5 is pushed.
          default: []
          selector:
            action: {}
        button_5_held:
          name: Button 5 held action
          description: Action to run when button 5 is held.
          default: []
          selector:
            action: {}
        button_5_doubleTapped:
          name: Button 5 doubleTapped action
          description: Action to run when button 5 is doubleTapped.
          default: []
          selector:
            action: {}
        button_5_released:
          name: Button 5 released action
          description: Action to run when button 5 is released.
          default: []
          selector:
            action: {}
trigger:
  - platform: state
    entity_id: !input button_1_entity
    id: button_1
  - platform: state
    entity_id: !input button_2_entity
    id: button_2
  - platform: state
    entity_id: !input button_3_entity
    id: button_3
  - platform: state
    entity_id: !input button_4_entity
    id: button_4
  - platform: state
    entity_id: !input button_5_entity
    id: button_5
action:
  - choose:
      - conditions: "{{ trigger.id == 'button_1' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'pushed' }}"
        sequence: !input button_1_pushed
      - conditions: "{{ trigger.id == 'button_1' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'held' }}"
        sequence: !input button_1_held
      - conditions: "{{ trigger.id == 'button_1' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'doubleTapped' }}"
        sequence: !input button_1_doubleTapped
      - conditions: "{{ trigger.id == 'button_1' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'released' }}"
        sequence: !input button_1_released
      - conditions: "{{ trigger.id == 'button_2' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'pushed' }}"
        sequence: !input button_2_pushed
      - conditions: "{{ trigger.id == 'button_2' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'held' }}"
        sequence: !input button_2_held
      - conditions: "{{ trigger.id == 'button_2' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'doubleTapped' }}"
        sequence: !input button_2_doubleTapped
      - conditions: "{{ trigger.id == 'button_2' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'released' }}"
        sequence: !input button_2_released
      - conditions: "{{ trigger.id == 'button_3' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'pushed' }}"
        sequence: !input button_3_pushed
      - conditions: "{{ trigger.id == 'button_3' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'held' }}"
        sequence: !input button_3_held
      - conditions: "{{ trigger.id == 'button_3' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'doubleTapped' }}"
        sequence: !input button_3_doubleTapped
      - conditions: "{{ trigger.id == 'button_3' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'released' }}"
        sequence: !input button_3_released
      - conditions: "{{ trigger.id == 'button_4' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'pushed' }}"
        sequence: !input button_4_pushed
      - conditions: "{{ trigger.id == 'button_4' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'held' }}"
        sequence: !input button_4_held
      - conditions: "{{ trigger.id == 'button_4' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'doubleTapped' }}"
        sequence: !input button_4_doubleTapped
      - conditions: "{{ trigger.id == 'button_4' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'released' }}"
        sequence: !input button_4_released
      - conditions: "{{ trigger.id == 'button_5' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'pushed' }}"
        sequence: !input button_5_pushed
      - conditions: "{{ trigger.id == 'button_5' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'held' }}"
        sequence: !input button_5_held
      - conditions: "{{ trigger.id == 'button_5' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'doubleTapped' }}"
        sequence: !input button_5_doubleTapped
      - conditions: "{{ trigger.id == 'button_5' and trigger.to_state is not none and trigger.to_state.attributes.get('event_type') == 'released' }}"
        sequence: !input button_5_released
mode: parallel
